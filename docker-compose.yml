services:
  postgres:
    image: postgres:17
    container_name: pressgo_postgres
    environment:
      POSTGRES_USER: pressgo_user
      POSTGRES_PASSWORD: pressgo_password
      POSTGRES_DB: pressgo_db
    ports:
      - "5433:5432"
    volumes:
      - pressgo_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pressgo_backend
    restart: always
    ports:
      - "5050:5050"
    environment:
      DATABASE_URL: postgresql://pressgo_user:pressgo_password@postgres:5432/pressgo_db
      JWT_SECRET: pressgo_docker_secret
      PORT: 5050
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npm run dev"

volumes:
  pressgo_postgres_data:
